<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetailIQ: Manage</title>
<style>
:root{--bg:#0d2530;--card:#143341;--line:#23495b;--ink:#eaf2f4;--mute:#8fb0bd;--gold:#f2b134;--good:#5cc8a1;--bad:#e5604d}
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:20px clamp(14px,4vw,40px)}
h1{margin:0 0 4px;font-size:28px}a{color:var(--gold)}.sub{color:var(--mute);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
input,select,button{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
button{cursor:pointer}button.go{background:var(--gold);color:#12303c;border:0;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs button.on{border-color:var(--gold);color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:7px;text-align:left}
td input{width:80px}.low{color:var(--bad)}#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1d6b52;color:#fff;padding:12px 20px;border-radius:12px;display:none;box-shadow:0 6px 24px #0007;max-width:90vw}#toast.err{background:#b8402f}
.tab{display:none}.tab.on{display:block}
</style></head><body>
<h1>Manage</h1><div class="sub"><a href="/">Back to dashboard</a> &middot; changes need your PIN</div>
<div class="card row"><b>PIN</b><input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN" autocomplete="off"></div>
<div class="row tabs" style="margin-bottom:12px"><button class="on" data-t="sell">Sell</button><button data-t="prod">Products and stock</button></div>

<div class="tab on card" id="sell">
 <div class="row"><select id="sp"></select><input id="sq" type="number" min="1" value="1" style="width:80px"><button class="go" onclick="addCart()">Add</button></div>
 <table id="cart" style="margin-top:12px"></table>
 <div class="row" style="margin-top:12px"><b id="total">Total: Rs 0</b><button class="go" onclick="saveBill()">Save bill</button><button onclick="cart=[];drawCart()">Clear</button></div>
</div>

<div class="tab card" id="prod">
 <div class="row"><input id="n" placeholder="Name"><input id="c" placeholder="Category"><input id="p" type="number" placeholder="Price" style="width:90px"><input id="k" type="number" placeholder="Cost" style="width:90px"><input id="s" type="number" placeholder="Stock" style="width:80px"><button class="go" onclick="addProd()">Add product</button></div>
 <table id="pt" style="margin-top:14px"></table>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);let prods=[],cart=[];
const say=(m,e)=>{const t=$('toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',e?5000:2500)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));$(b.dataset.t).classList.add('on')});
$('pin').value=sessionStorage.getItem('pin')||'';$('pin').oninput=e=>sessionStorage.setItem('pin',e.target.value);
async function api(url,method,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-PIN':$('pin').value},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Error '+r.status);return d}
async function load(){prods=await (await fetch('/api/products')).json();
 $('sp').innerHTML=prods.map(p=>`<option value="${p.id}"${p.stock<=0?' disabled':''}>${p.name} (${p.stock>0?'stock '+p.stock:'out of stock'}, Rs ${p.price})</option>`).join('');const f=prods.find(p=>p.stock>0);if(f)$('sp').value=f.id;
 $('pt').innerHTML='<tr><th>Product</th><th>Price</th><th>Cost</th><th>Stock</th><th>Add stock</th></tr>'+prods.map(p=>`<tr><td>${p.name}</td>
 <td><input id="pr${p.id}" type="number" value="${p.price}"></td><td><input id="co${p.id}" type="number" value="${p.cost_price}"></td>
 <td class="${p.stock<=5?'low':''}">${p.stock}</td><td><input id="st${p.id}" type="number" placeholder="+qty" style="width:70px"> <button onclick="addStock(${p.id})">Add</button> <button onclick="savePrice(${p.id})">Save price</button></td></tr>`).join('')}
function drawCart(){let t=0;$('cart').innerHTML=cart.map((c,i)=>{const p=prods.find(x=>x.id==c.product_id);t+=p.price*c.qty;return `<tr><td>${p.name}</td><td>${c.qty}</td><td>Rs ${p.price*c.qty}</td><td><button onclick="cart.splice(${i},1);drawCart()">x</button></td></tr>`}).join('');$('total').textContent='Total: Rs '+t}
function addCart(){const id=parseInt($('sp').value),q=parseInt($('sq').value),p=prods.find(x=>x.id==id);if(!p||!(q>0))return say('Enter a quantity',1);const n=cart.filter(c=>c.product_id==id).reduce((a,c)=>a+c.qty,0);if(p.stock-n<q)return say(p.name+': only '+Math.max(p.stock-n,0)+' left in stock',1);cart.push({product_id:id,qty:q});drawCart()}
async function saveBill(){if(!cart.length)return say('Add items first');try{const d=await api('/api/sale','POST',{items:cart});say('Saved. Total Rs '+d.total);cart=[];drawCart();load()}catch(e){say(e.message,1)}}
async function addProd(){try{await api('/api/products','POST',{name:$('n').value,category:$('c').value,price:+$('p').value,cost_price:+$('k').value,stock:parseInt($('s').value||0)});say('Product added');['n','c','p','k','s'].forEach(i=>$(i).value='');load()}catch(e){say(e.message,1)}}
async function addStock(id){const v=parseInt($('st'+id).value);if(!v)return;if(v<0&&!confirm('Remove '+(-v)+' units from stock?'))return;try{await api('/api/stock','POST',{product_id:id,delta:v});say('Stock updated');load()}catch(e){say(e.message,1)}}
async function savePrice(id){try{await api('/api/products/'+id,'PUT',{price:+$('pr'+id).value,cost_price:+$('co'+id).value});say('Price saved');load()}catch(e){say(e.message,1)}}
load();
</script></body></html>
